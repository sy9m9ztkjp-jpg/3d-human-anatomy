<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Human Anatomy Explorer</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        p {
            color: #aaa;
        }
    </style>
</head>

<body>

    <div id="info">
        <h1>3D Human Anatomy Explorer</h1>
        <p>Drag to rotate • Scroll to zoom</p>
    </div>

    <script type="module" src="app.js"></script>

</body>
